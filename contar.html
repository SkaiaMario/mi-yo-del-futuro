<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <main>
        <h1>Contar mi experiencia</h1>
        <p>Cuéntanos qué ocurrió, con tus propias palabras.</p>
        <form action="https://submit-form.com/defViP7ZM" method="POST">
            <label>¿En qué idioma quieres compartir tu experiencia?</label>
            <select name="idioma">
                <option>Español</option>
                <option>English</option>
                <option>Français</option>
                <option>Deutsch</option>
            </select>
            <br><br>    
            <label>¿Cómo quieres aparecer?</label>
            <select name="aparicion">
                <option>Anónimo</option>
                <option>Pseudónimo</option>
                <option>Nombre completo</option>
                <option>Solo nombre</option>
            </select>
            <br><br>
            <label>Nombre o pseudónimo que quieres mostrar:</label>
            <input type="text" name="nombre_mostrado">
            <br><br>
            <label>Si quieres que podamos contactarte, puedes dejarnos un correo electrónico.</label>
            <input type="email" name="correo">
            <br><br>           
            <label>¿Había otras personas presentes y qué percibieron?</label>
            <textarea name="testigos"></textarea>
            <br><br>  
            <label>¿Qué tipo de experiencia quieres compartir?</label>
            <select name="tipo">
                <option>Memorias</option>
                <option>Sueños</option>
                <option>Déjà vu</option>
                <option>Coincidencias</option>
                <option>Encuentros</option>
                <option>Apariciones</option>
                <option>Tiempo</option>
                <option>Infancia</option>
                <option>Percepciones</option>
                <option>Otro</option>
            </select>
            <br><br>
            <label>¿Qué edad tienes actualmente?</label>
            <input type="number" name="edad_actual">
            <br><br>
            <label>¿Qué edad tenías cuando ocurrió?</label>
            <input type="number" name="edad_evento">
            <br><br>
            <label>¿Dónde ocurrió?</label>
            <input type="text" name="lugar">
            <br><br>
            <label>¿Cuándo ocurrió aproximadamente?</label>
            <input type="text" name="fecha_aproximada">
            <br><br>
            <label>Cuéntanos qué ocurrió, con tus propias palabras:</label>
            <textarea name="experiencia"></textarea>
            <br><br>
            <label>¿Cuándo comenzaste a pensar que lo ocurrido era inexplicable?</label>
            <textarea name="momento_inexplicable"></textarea>
            <br><br>
            <label>¿Hay algo más que quieras agregar?</label>
            <textarea name="informacion_adicional"></textarea>
            <br><br>
            <label>¿Tienes algún material adicional relacionado con tu experiencia?</label>
            <select name="material">
            <option>Fotografía</option>
            <option>Video</option>
            <option>Audio</option>
            <option>Documento</option>
            <option>Ninguno</option>
            </select>
            <br><br>
            <label>¿Qué autorizas que hagamos con tu experiencia?</label>
            <select name="autorizacion">
                <option>Publicar en el archivo público</option>
                <option>Considerarla para el libro</option>
                <option>Publicar en el archivo y considerarla para el libro</option>
                <option>No autorizo publicación ni uso para el libro</option>
            </select>
            <br><br>
            <label>¿Autorizas correcciones de redacción sin cambiar el sentido de tu experiencia?</label>
            <select name="edicion">
                <option>Sí, autorizo</option>
                <option>No autorizo</option>
            </select>
            <br><br>
            <label>Confirmo que las opciones que he seleccionado reflejan mi autorización sobre el uso de esta experiencia.</label>
            <input type="checkbox" name="confirmacion_autorizacion">
            <br><br>
            <label>Confirmo que la experiencia que comparto corresponde a mi propio relato y que la información proporcionada es correcta según mi conocimiento.</label>
            <input type="checkbox" name="confirmacion_relato">
            <br><br>
            <button>Enviar experiencia</button>
        </form>
        <a href="index.html">Volver al inicio</a>
    </main>
</body>
</html>
