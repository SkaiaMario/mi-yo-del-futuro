<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <main>
        <h1>Contar mi experiencia</h1>
        <p>Cuéntanos qué ocurrió, con tus propias palabras.</p>
        <form action="https://submit-form.com/defViP7ZM" method="POST">
            <label>¿Cómo quieres aparecer?</label>
            <select name="aparicion">
                <option>Anónimo</option>
                <option>Pseudónimo</option>
                <option>Nombre completo</option>
                <option>Solo nombre</option>
            </select>
            <br><br>
            <label>¿Qué tipo de experiencia quieres compartir?</label>
            <select name="tipo">
                <option>Memoria</option>
                <option>Sueños</option>
                <option>Déjà vu</option>
                <option>Coincidencias</option>
                <option>Percepciones</option>
                <option>Otro</option>
            </select>
            <br><br>
            <label>Cuéntanos tu experiencia:</label>
            <textarea name="experiencia"></textarea>
            <br><br>
            <button>Enviar experiencia</button>
        </form>
        <a href="index.html">Volver al inicio</a>
    </main>
</body>
</html>
